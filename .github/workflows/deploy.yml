
name: CI Docker

on:
  push:
    branches:
      - master

jobs:
  build:
    name: Build e Push GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          tags: ghcr.io/cezar4ugust/projeto-einfo:v1
          labels: |
            org.opencontainers.image.source=https://github.com/Cezar4ugust/Server_projeto_einfo
