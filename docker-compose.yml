services:

  api:
    build:
    container_name: projeto-api
    ports:
      - 3333:3333
    environment:
      DATABASE_URL: postgresql://postgres:12345@postgres:5432/projet

    depends_on:
      - postgres

  postgres:
    image: postgres:17
    container_name: projeto-postgres
    environment:
      - POSTGRES_USERS: postgres
        POSTGRES_PASSWORD: 123456
        POSTGRES_DB: projeto]
    ports:
      - 5432:5432
    volumes:
      - postgres_data:/var/lib/posgresql/data

  volumes:
    postgres_data: